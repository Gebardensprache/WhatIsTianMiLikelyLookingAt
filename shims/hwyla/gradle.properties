# The name of your mod. Can be any sequence of characters.
modName = Jade HWYLA Compatibility

# This is a case-sensitive string to identify your mod.
# Must be less than 64 characters and all lowercase. Convention is to only contain alphabetic characters.
modId = waila

# Project package location.
modGroup = snownee.jade.shim.hwyla

# Version of your mod.
modVersion=1.0.0

# The name of your jar when you produce builds, not including any versioning info
archiveName = JadeHWYLAShim
mcVersion=1.12.2

# Select a username for testing your mod with breakpoints.
devUserName = Developer

# Additional arguments applied to the JVM when launching minecraft
extJavaArgs =
# Package path under which JvmDowngrader's shaded API stubs are relocated.
jvmdgShadowPath =
# Enables modern-Java runClient/runServer tasks using LWJGL3ify.
# This is primarily used to test if your mod is compatible with platforms running
# Minecraft 1.12.2 on modern versions of Java and LWJGL, and assist in fixing any problems with it.
# These tasks run on a JetBrains Runtime 25 toolchain, provisioned automatically.
useLwjgl3ify = true

# Generate a class with String fields for the mod id, name and version named with the fields below
generateTags = false

# Specify the configuration file for Forge's access transformers here.
accessTransformers =

# Provides setup for Mixins if enabled.
# 1.12.2 backport: shims are thin compatibility bridges; no mixins needed.
useMixin=false
mixinPackage =
mixinRefmap=
coreModClass =
forceLoadAsMod=false

enableCoreModDebug = false

minimizeShadowedDependencies = true
relocateShadowedDependencies = true
separateRunDirectories = false
# Environments that the mod can run on. Accepts client, server, or both (default).
environment=both

versionDisplayFormat = $MOD_NAME − $VERSION

modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =
releaseChannel=release

customMavenPublishUrl =
mavenArtifactGroup =

enableSpotless = false
enableJUnit = true

deploymentDebug = false


## Gradle Settings
org.gradle.logging.stacktrace = all
org.gradle.jvmargs = -Xmx3G

org.gradle.caching = true
org.gradle.configureondemand = true
org.gradle.parallel = true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
